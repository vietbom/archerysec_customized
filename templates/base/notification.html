<li class="nav-item dropdown notification-inbox" data-feed-url="{% url 'dashboard:notification_feed' %}">
    <button class="nav-link dropdown-toggle notification-toggle" type="button" id="notification-toggle"
            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
        <i class="mdi mdi-bell font-24" aria-hidden="true"></i>
        <span class="notification-count" hidden aria-live="polite">0</span>
    </button>
    <div class="dropdown-menu dropdown-menu-right notification-menu" aria-labelledby="notification-toggle">
        <div class="notification-heading"><strong>Notifications</strong>
            <form method="post" action="{% url 'webscanners:del_all_notify' %}" class="notification-form notification-clear">
                {% csrf_token %}<button type="submit" class="notification-clear-button">Mark all read</button>
            </form>
        </div>
        <div class="notification-items" role="list" aria-live="polite"><p class="notification-empty">Loading notifications...</p></div>
        <p class="notification-error" role="status" hidden></p>
        <form method="post" action="{% url 'webscanners:del_notify' %}" class="notification-dismiss-template" hidden>
            {% csrf_token %}<input type="hidden" name="notify_id">
        </form>
    </div>
</li>
